name: Publish TreasuryIQ website

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: treasuryiq-github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish static demo site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify application and market snapshot
        run: |
          node --input-type=module --check < assets/app.js
          node --input-type=module --check < assets/loader.js
          node --check assets/treasury-analytics.mjs
          node --check assets/treasury-workspace.mjs
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {mmComputeInstrument,mmReconciliation,mmWindow,mmMetricSummary,mmDetectAnomalies,mmAggregate} from './assets/treasury-analytics.mjs';
          import {renderTreasuryWorkspace,mmAnalystAnswer,mWorkspaceHTML} from './assets/treasury-workspace.mjs';
          const input={interbank_vnd_loan:100e9,interbank_usd_loan:2e6,bond_pap:50e9,bond_trading:20e9,bond_afs:10e9,reso_vnd:5e9,secured_vnd:30e9,secured_usd:.4e6,unsecured_vnd:12e9,unsecured_usd:.08e6,cd_maturity_vnd:10e9,ld_vnd_balance:55e9,ld_vnd_rate:8,mm_funding_vnd_rate:5};
          const output=mmComputeInstrument(input,25000);
          for(const [key,val] of Object.entries({loan_bn:150,invest_gtcg_bn:80,reso_bn:5,secured_bn:40,unsecured_bn:14,swap_bn:11,gtcg_scale_bn:60,ld_scale_bn:54,ld_nim_pct:3,instrument_recon_gap_bn:0}))assert.ok(Math.abs(output[key]-val)<1e-9,key);
          assert.equal(mmComputeInstrument(input,null).loan_bn,null);
          const tf=mmComputeInstrument({...input,hasTradeFinance:true,trade_finance_vnd:3e9},25000);
          assert.ok(Math.abs(mmReconciliation(tf).gap+3)<1e-9);
          assert.deepEqual(mmWindow([],'2026-11-13','prev_mtd').compare,['2026-10-01','2026-10-13']);
          assert.deepEqual(mmWindow([],'2026-11-13','prev_full').compare,['2026-10-01','2026-10-31']);
          assert.deepEqual(mmWindow([],'2026-11-13','yoy_mtd').compare,['2025-11-01','2025-11-13']);
          const r=[{date:'2026-10-01',loan_bn:10},{date:'2026-10-02',loan_bn:30},{date:'2026-11-01',loan_bn:20},{date:'2026-11-02',loan_bn:40}];
          assert.equal(mmMetricSummary(r,'loan_bn',mmWindow(r,'2026-11-02','prev_mtd')).current.mean,30);
          assert.equal(mmAggregate(r,'monthly_eop').at(-1).loan_bn,40);
          assert.equal(typeof renderTreasuryWorkspace,'function');
          const partial={date:'2026-11-12',itb_on:5.6};
          const mmRow={date:'2026-10-26',loan_bn:100,gtcg_scale_bn:55,ld_scale_bn:30,ld_nim_pct:2,invest_gtcg_bn:40,reso_bn:10,secured_bn:20,unsecured_bn:10,swap_bn:20,trade_finance_bn:null};
          const view=mWorkspaceHTML([mmRow,partial],{period:'3M',freq:'daily'});
          assert.equal(view.latest.date,'2026-10-26');
          assert.ok(view.dashboard.includes('26/10/2026'));
          assert.ok(view.detailed.includes('Trade Finance'));
          const answer=mmAnalystAnswer('cơ cấu book',{meta:{kind:'private-local'},series:[mmRow,partial]});
          assert.ok(answer.includes('26/10/2026'));
          const nodes=new Map(['#mmOverview','#mmAnalyticWorkspace','#gtcgChart','#reconDetails'].map(k=>[k,{innerHTML:''}]));
          globalThis.document={
            body:{classList:{toggle() {}}},
            querySelector:key=>nodes.get(key)||null,
            querySelectorAll:()=>[],
            addEventListener() {}
          };
          renderTreasuryWorkspace({meta:{kind:'private-local'},series:[mmRow,partial]},{period:'3M',freq:'daily'});
          assert.ok(nodes.get('#mmOverview').innerHTML.includes('Quản trị quy mô'));
          assert.ok(nodes.get('#mmAnalyticWorkspace').innerHTML.includes('Bình quân'));
          assert.ok(nodes.get('#mmAnalyticWorkspace').innerHTML.includes('Công thức'));
          assert.ok(nodes.get('#gtcgChart').innerHTML.length>50);
          assert.equal(typeof mmAnalystAnswer,'function');
          assert.ok(readFileSync('index.html','utf8').includes('id="mmAnalyticWorkspace"'));
          assert.ok(readFileSync('assets/app.js','utf8').includes('VBMA_FIELDS'));
          assert.ok(readFileSync('assets/loader.js','utf8').includes('mmComputeInstrument'));
          console.log('Treasury Quant / Risk / UI smoke checks passed');
          NODE
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          assert not (root/'data/demo.json').exists(), 'Public deployment must not include synthetic MM balance series'
          d=json.loads((root/'data/public_snapshot.json').read_text(encoding='utf-8'))
          assert len(set(x['tenor'] for x in d['interbank']))>=7
          assert d['fx']['date'] and d['fx']['rate']>0
          assert len(d.get('fxHistory',[]))>=7
          assert 'PRIVATE KEY' not in (root/'assets/app.js').read_text(encoding='utf-8')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package published assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
