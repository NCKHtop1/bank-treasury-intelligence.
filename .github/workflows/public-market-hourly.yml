name: TreasuryIQ - public market hourly sweep

on:
  schedule:
    # 07:00-19:00 Vietnam time, Monday-Friday (00:00-12:00 UTC).
    - cron: '0 0-12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treasury-market-sweep
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh verified public market endpoint
        env:
          MARKET_URL: ${{ vars.TREASURY_PUBLIC_REFRESH_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${MARKET_URL:-}" || -z "${VERCEL_BYPASS:-}" ]]; then
            echo "Configure TREASURY_PUBLIC_REFRESH_URL and VERCEL_AUTOMATION_BYPASS_SECRET first."
            exit 1
          fi
          case "$MARKET_URL" in
            https://*.vercel.app|https://*.vercel.app/) ;;
            *) echo "Only Vercel HTTPS URL is accepted"; exit 1 ;;
          esac
          curl --fail --show-error --silent --location --retry 2 --max-time 25 \
            --header "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            "${MARKET_URL%/}/api/market" >/dev/null
